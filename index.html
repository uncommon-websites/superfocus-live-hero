<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focus Timer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes scaleIn {
            from { opacity: 0; transform: scale(0.97); }
            to { opacity: 1; transform: scale(1); }
        }

        .animate-fade-in-up {
            opacity: 0;
            animation: fadeInUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .animate-fade-in {
            opacity: 0;
            animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .animate-scale-in {
            opacity: 0;
            animation: scaleIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .delay-0 { animation-delay: 0ms; }
        .delay-100 { animation-delay: 100ms; }
        .delay-200 { animation-delay: 200ms; }
        .delay-300 { animation-delay: 300ms; }
        .delay-400 { animation-delay: 400ms; }

        .text-balance { text-wrap: balance; }
        .text-pretty { text-wrap: pretty; }

        @media (prefers-reduced-motion: reduce) {
            .animate-fade-in-up, .animate-fade-in, .animate-scale-in {
                animation: none;
                opacity: 1;
                transform: none;
            }
        }

        /* Custom utility for the active sidebar item indicator */
        .sidebar-active-indicator::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            height: 20px;
            width: 3px;
            background-color: white;
            border-top-right-radius: 4px;
            border-bottom-right-radius: 4px;
        }
    </style>
</head>
<body class="bg-black text-white font-sans antialiased overflow-hidden selection:bg-white/30">

    <div class="flex h-screen w-full">
        
        <!-- Sidebar -->
        <aside class="w-[68px] bg-[#18181a] flex flex-col items-center py-6 border-r border-white/5 z-20 shrink-0 animate-fade-in delay-0">
            <!-- Top Logo/Icon -->
            <div class="mb-12 cursor-pointer hover:opacity-80 transition-opacity">
                <svg class="w-6 h-6 text-white" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M2 21h18v-2H2v2zm15-14h1.5c1.38 0 2.5 1.12 2.5 2.5S19.88 12 18.5 12H17v1.5c0 3.03-2.47 5.5-5.5 5.5h-1C7.47 19 5 16.53 5 13.5V5h12v2zm-2 0H7v6.5C7 14.88 8.12 16 9.5 16h1c1.38 0 2.5-1.12 2.5-2.5V7zm3.5 3H17v-1h1.5c.28 0 .5.22.5.5s-.22.5-.5.5z"/>
                </svg>
            </div>

            <!-- Middle Navigation Icons -->
            <nav class="flex flex-col gap-8 w-full relative">
                <!-- Timer (Active) -->
                <div class="relative w-full flex justify-center cursor-pointer sidebar-active-indicator group">
                    <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <circle cx="12" cy="13" r="8"></circle>
                        <path d="M12 9v4l2 2"></path>
                        <path d="M10 3h4"></path>
                        <path d="M12 3v2"></path>
                    </svg>
                </div>
                <!-- Tasks/Check -->
                <div class="w-full flex justify-center cursor-pointer group">
                    <svg class="w-5 h-5 text-[#8a8a8e] group-hover:text-white transition-colors" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <circle cx="12" cy="12" r="9"></circle>
                        <path d="M9 12l2 2 4-4"></path>
                    </svg>
                </div>
                <!-- Calendar/Board -->
                <div class="w-full flex justify-center cursor-pointer group">
                    <svg class="w-5 h-5 text-[#8a8a8e] group-hover:text-white transition-colors" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                        <path d="M16 2v4"></path>
                        <path d="M8 2v4"></path>
                        <path d="M3 10h18"></path>
                    </svg>
                </div>
                <!-- Analytics/Chart -->
                <div class="w-full flex justify-center cursor-pointer group">
                    <svg class="w-5 h-5 text-[#8a8a8e] group-hover:text-white transition-colors" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path d="M3 3v18h18"></path>
                        <path d="M18 9l-5 5-4-4-4 4"></path>
                    </svg>
                </div>
                <!-- Trophy/Achievements -->
                <div class="w-full flex justify-center cursor-pointer group">
                    <svg class="w-5 h-5 text-[#8a8a8e] group-hover:text-white transition-colors" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path d="M8 21h8"></path>
                        <path d="M12 17v4"></path>
                        <path d="M7 4h10v5.5c0 2.5-2 4.5-5 4.5s-5-2-5-4.5V4z"></path>
                        <path d="M7 6H4v2c0 1.5 1 3 3 3"></path>
                        <path d="M17 6h3v2c0 1.5-1 3-3 3"></path>
                    </svg>
                </div>
            </nav>

            <!-- Bottom User Icon -->
            <div class="mt-auto cursor-pointer group">
                <svg class="w-5 h-5 text-[#8a8a8e] group-hover:text-white transition-colors" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                </svg>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="relative flex-1 h-full bg-[#2a2a2a]">
            
            <!-- Background Image -->
            <img 
                src="https://placehold.co/1920x1080/333333/444444?text=Illustration" 
                alt="Cozy study environment" 
                class="absolute inset-0 w-full h-full object-cover animate-fade-in delay-0"
            />
            
            <!-- Subtle Gradient Overlay for Text Readability -->
            <div class="absolute inset-0 bg-gradient-to-b from-black/10 via-transparent to-black/40 animate-fade-in delay-0 pointer-events-none"></div>

            <!-- Top Right Navigation -->
            <header class="absolute top-6 right-8 flex items-center gap-3 z-30 animate-fade-in delay-100">
                <button class="px-5 py-2 rounded-full border border-white/30 text-white text-sm font-medium hover:bg-white/10 transition-colors duration-200 backdrop-blur-sm">
                    Log in
                </button>
                <button class="px-5 py-2 rounded-full bg-white text-black text-sm font-medium hover:opacity-90 active:scale-97 transition-all duration-200 shadow-sm">
                    Sign up for free
                </button>
            </header>

            <!-- Center Timer Display -->
            <div class="absolute inset-0 flex flex-col items-center justify-center pointer-events-none z-20">
                
                <!-- Timer Circle Container -->
                <div class="relative flex items-center justify-center w-[380px] h-[380px] md:w-[500px] md:h-[500px] animate-scale-in delay-200">
                    
                    <!-- Faint Background Track -->
                    <div class="absolute inset-0 rounded-full border-[3px] border-white/30"></div>
                    
                    <!-- Progress Indicator Dot (Positioned at top/start) -->
                    <div class="absolute top-[-4.5px] left-1/2 -translate-x-1/2 w-3 h-3 bg-white rounded-full"></div>
                    
                    <!-- Time Text -->
                    <span class="text-[120px] md:text-[160px] font-medium tracking-tight text-white leading-none drop-shadow-md select-none">
                        25:00
                    </span>
                </div>

            </div>

            <!-- Bottom Controls -->
            <div class="absolute bottom-12 left-1/2 -translate-x-1/2 z-30 animate-fade-in-up delay-300">
                <button class="flex items-center gap-2.5 bg-white text-black px-8 py-3.5 rounded-full font-medium text-[15px] hover:opacity-90 active:scale-97 transition-all duration-200 shadow-xl pointer-events-auto">
                    <svg class="w-4 h-4 ml-0.5" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M8 5v14l11-7z"/>
                    </svg>
                    Start
                </button>
            </div>

        </main>
    </div>

</body>
</html>
