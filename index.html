<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focus Timer Hero</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Animation keyframes */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
                filter: blur(4px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
                filter: blur(0);
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes scaleIn {
            from {
                opacity: 0;
                transform: scale(1.05);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes slideInLeft {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        /* Base animation classes */
        .animate-fade-in-up {
            opacity: 0;
            animation: fadeInUp 0.8s cubic-bezier(0.22, 0.61, 0.36, 1) forwards;
        }

        .animate-fade-in {
            opacity: 0;
            animation: fadeIn 0.8s cubic-bezier(0.22, 0.61, 0.36, 1) forwards;
        }

        .animate-scale-in {
            opacity: 0;
            animation: scaleIn 1.2s cubic-bezier(0.22, 0.61, 0.36, 1) forwards;
        }

        .animate-slide-in-left {
            opacity: 0;
            animation: slideInLeft 0.6s cubic-bezier(0.22, 0.61, 0.36, 1) forwards;
        }

        /* Staggered delays */
        .delay-0 { animation-delay: 0ms; }
        .delay-100 { animation-delay: 100ms; }
        .delay-200 { animation-delay: 200ms; }
        .delay-300 { animation-delay: 300ms; }
        .delay-400 { animation-delay: 400ms; }
        .delay-500 { animation-delay: 500ms; }
        .delay-600 { animation-delay: 600ms; }
        .delay-700 { animation-delay: 700ms; }

        /* Utilities */
        .text-balance { text-wrap: balance; }
        
        /* Custom scrollbar hide */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        @media (prefers-reduced-motion: reduce) {
            *, ::before, ::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
                scroll-behavior: auto !important;
            }
        }
    </style>
</head>
<body class="bg-black text-white h-screen w-screen overflow-hidden font-sans antialiased">

    <div class="flex h-full w-full">
        <!-- Sidebar -->
        <aside class="w-16 md:w-20 h-full bg-[#18181b] flex flex-col items-center py-6 border-r border-white/5 z-20 animate-slide-in-left delay-0 shrink-0">
            <!-- Logo -->
            <div class="mb-10 text-white/90 hover:text-white cursor-pointer transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor" class="w-6 h-6 md:w-7 md:h-7">
                    <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V5h14v14z"/>
                    <path d="M7 7h2v2H7zm0 4h2v2H7zm0 4h2v2H7zm4-8h6v2h-6zm0 4h6v2h-6zm0 4h6v2h-6z"/>
                </svg>
            </div>

            <!-- Navigation Icons -->
            <nav class="flex flex-col gap-8 items-center w-full">
                <button class="text-white/60 hover:text-white transition-colors group relative animate-fade-in delay-100">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5 md:w-6 md:h-6">
                        <circle cx="12" cy="12" r="10"></circle>
                        <polyline points="12 6 12 12 16 14"></polyline>
                    </svg>
                    <!-- Active indicator -->
                    <div class="absolute -left-6 md:-left-8 top-1/2 -translate-y-1/2 w-1 h-5 bg-white rounded-r-full"></div>
                </button>

                <button class="text-white/60 hover:text-white transition-colors animate-fade-in delay-200">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5 md:w-6 md:h-6">
                        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                        <polyline points="22 4 12 14.01 9 11.01"></polyline>
                    </svg>
                </button>

                <button class="text-white/60 hover:text-white transition-colors animate-fade-in delay-300">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5 md:w-6 md:h-6">
                        <rect x="3" y="3" width="7" height="7"></rect>
                        <rect x="14" y="3" width="7" height="7"></rect>
                        <rect x="14" y="14" width="7" height="7"></rect>
                        <rect x="3" y="14" width="7" height="7"></rect>
                    </svg>
                </button>

                <button class="text-white/60 hover:text-white transition-colors animate-fade-in delay-400">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5 md:w-6 md:h-6">
                        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                    </svg>
                </button>

                <button class="text-white/60 hover:text-white transition-colors animate-fade-in delay-500">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5 md:w-6 md:h-6">
                        <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
                    </svg>
                </button>

                <button class="text-white/60 hover:text-white transition-colors animate-fade-in delay-600">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5 md:w-6 md:h-6">
                        <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"></path>
                        <path d="M18 9h1.5a2.5 2.5 0 0 1 0 5H18"></path>
                        <path d="M4 22h16"></path>
                        <path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"></path>
                        <path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"></path>
                        <path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"></path>
                    </svg>
                </button>
            </nav>

            <!-- Bottom Profile Icon -->
            <div class="mt-auto animate-fade-in delay-700">
                <button class="text-white/60 hover:text-white transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5 md:w-6 md:h-6">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                </button>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="relative flex-1 h-full overflow-hidden bg-gray-900">
            <!-- Background Image -->
            <div class="absolute inset-0 w-full h-full animate-scale-in">
                <!-- Using a warm, cozy illustration placeholder -->
                <img src="https://placehold.co/1920x1080/d4bba3/333?text=Cozy+Anime+Room+Illustration" 
                     alt="Cozy room background" 
                     class="w-full h-full object-cover opacity-90" />
                <!-- Subtle overlay to ensure text contrast -->
                <div class="absolute inset-0 bg-black/10"></div>
            </div>

            <!-- Top Right Buttons -->
            <div class="absolute top-6 right-6 md:top-8 md:right-8 flex items-center gap-3 z-20">
                <button class="animate-fade-in delay-300 px-5 py-2 rounded-full border border-white/40 bg-black/10 text-white text-sm font-medium backdrop-blur-sm hover:bg-black/20 transition-all">
                    Log in
                </button>
                <button class="animate-fade-in delay-400 px-5 py-2 rounded-full bg-white text-gray-900 text-sm font-medium hover:bg-gray-100 transition-colors shadow-lg">
                    Sign up for free
                </button>
            </div>

            <!-- Center Timer -->
            <div class="absolute inset-0 flex items-center justify-center z-10">
                <div class="relative w-[300px] h-[300px] md:w-[400px] md:h-[400px] flex items-center justify-center animate-fade-in-up delay-200">
                    <!-- SVG Ring -->
                    <svg class="absolute inset-0 w-full h-full rotate-[-90deg]" viewBox="0 0 100 100">
                        <!-- Track -->
                        <circle cx="50" cy="50" r="48" fill="none" stroke="white" stroke-width="0.8" stroke-opacity="0.4" />
                        <!-- Progress Dot (at top/start) -->
                        <circle cx="98" cy="50" r="1.5" fill="white" />
                    </svg>
                    
                    <!-- Timer Text -->
                    <h1 class="text-7xl md:text-9xl font-light tracking-tight text-white drop-shadow-sm select-none">
                        25:00
                    </h1>
                </div>
            </div>

            <!-- Bottom Start Button -->
            <div class="absolute bottom-12 md:bottom-16 left-1/2 -translate-x-1/2 z-20 animate-fade-in-up delay-500">
                <button class="group flex items-center gap-2 bg-white text-gray-900 px-8 py-3 rounded-full font-medium text-base hover:scale-105 transition-transform duration-200 shadow-xl">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="fill-current">
                        <polygon points="5 3 19 12 5 21 5 3"></polygon>
                    </svg>
                    <span>Start</span>
                </button>
            </div>
        </main>
    </div>

</body>
</html>
